name: Deploy Durable Objects

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**' # Trigger if types change too
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # 3. DEPLOY
      - name: Deploy to Cloudflare
        working-directory: apps/worker
        run: npx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 4. AUDIT (Your existing step)
      - name: Run Live Audit
        run: npm run test:audit:staging --workspace=@camp_candor/worker
        env:
          STAGING_URL: https://worker-agent.berad4000.workers.dev
